# Builds the Android app of «SCP: Побег» (the web game from scp/ inside a WebView)
# and puts the files on the branch android-build: unsigned APK/AAB for the stores
# (signed outside CI, the key is not in this repo) and a debug APK to try on a phone.
name: Android app (SCP)

on:
  push:
    branches: [main]
    paths: ['android/**', 'scp/**', '.github/workflows/android-scp.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-scp
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Game files
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r scp/. android/app/src/main/assets/www/
          V=$(grep -o 'версия [0-9]*' scp/index.html | head -1 | grep -o '[0-9]*$')
          echo "game version $V"
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PgameVersion="$V" assembleRelease bundleRelease assembleDebug

      - name: Collect
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir out
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk out/scp-escape-unsigned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/scp-escape-unsigned.aab
          cp android/app/build/outputs/apk/debug/app-debug.apk out/scp-escape-debug.apk
          cp "$BT/lib/apksigner.jar" out/
          echo "version $V, commit $GITHUB_SHA" > out/BUILD.txt
          ls -la out

      - name: Publish to branch android-build
        run: |
          cd out
          git init -q -b android-build
          git config user.name "github-actions[bot]"
          git config user.email "41898169+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Android build v$V ($GITHUB_SHA)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" android-build
