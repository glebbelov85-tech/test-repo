# Turns the old github.io addresses into redirects to the GitVerse copy.
# https://glebbelov85-tech.github.io/test-repo/scp/  →  https://<owner>.gitverse.site/<repo>/scp/
# The games themselves stay in main untouched (GitVerse gets them via gitverse-mirror.yml);
# GitHub Pages only gets small redirect pages built here, plus test copies from the
# «preview» branch at /test/<folder>/ (run this workflow by hand after pushing there).
# Switch on: variable GITVERSE_PAGES_URL = https://<owner>.gitverse.site/<repo>
# and Settings → Pages → Source: «GitHub Actions».
name: GitHub Pages → GitVerse redirect

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.GITVERSE_PAGES_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build redirect pages
        env:
          TARGET: ${{ vars.GITVERSE_PAGES_URL }}
        run: python3 .github/redirect/build.py "$TARGET" _site

      # Test copies: folders named in the PREVIEW file of the «preview» branch are served
      # for real at /test/<folder>/ (GitHub only, they never reach GitVerse).
      - name: Add test copies from the preview branch
        run: |
          if git fetch --depth=1 origin preview 2>/dev/null; then
            git worktree add _preview FETCH_HEAD
            for d in $(cat _preview/PREVIEW 2>/dev/null); do
              case "$d" in */*|.*) continue;; esac
              if [ -d "_preview/$d" ]; then mkdir -p _site/test; cp -r "_preview/$d" "_site/test/$d"; fi
            done
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
