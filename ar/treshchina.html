<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Трещина в стене</title>
<link rel="stylesheet" href="core.css">
</head>
<body>
<script src="core.js"></script>
<script src="monstry.js"></script>
<script>
"use strict";
// ===== Трещина в стене =====
// На стенах комнаты открываются светящиеся разломы. Из них вылезают чертята:
// сначала крошечные в глубине трещины, потом спрыгивают на пол и бегут к игроку.
// Тапай по чертятам, а саму трещину "заделывай" тапами, пока она не выпустила всех.
const WALL = 3.2;        // на каком расстоянии "стена"
const MAX_LIVES = 5;
const COLORS = ['#c35bff', '#ff4a2a', '#2affc8', '#ffd02a', '#ff4fd8'];
let rifts = [], imps = [], score = 0, lives = MAX_LIVES, level = 1, riftsLeft = 0, nextRiftT = 0, levelClearT = 0;
let glow = COLORS[0];

const sfx = {
  crack() { noise(0.5, 0.45, 3000, 0, 'highpass'); noise(0.9, 0.35, 300); tone(50, 1.2, 'sawtooth', 0.12, 0.6); },
  creak() { tone(90 + Math.random() * 40, 0.4, 'sawtooth', 0.05, 1.6); },
  seal() { tone(660, 0.08, 'triangle', 0.1); tone(990, 0.12, 'triangle', 0.08, 1, 0.06); },
  sealed() { [523, 784, 1046, 1568].forEach((f, i) => tone(f, 0.2, 'triangle', 0.1, 1, i * 0.08)); noise(0.4, 0.15, 5000, 0, 'highpass'); },
  emerge() { tone(300, 0.25, 'square', 0.04, 2.5); },
  kill() { noise(0.2, 0.3, 1200); tone(700, 0.08, 'square', 0.07); tone(350, 0.15, 'square', 0.07, 0.5, 0.06); },
  hurt() { tone(140, 0.45, 'sawtooth', 0.22, 0.4); noise(0.3, 0.3, 500); },
  miss() { tone(1200, 0.06, 'square', 0.03, 0.5); }
};

// трещина: несколько ломаных линий из центра + рваная дыра
function makeRift(yaw, h) {
  const cracks = [];
  const n = 6 + Math.floor(Math.random() * 4);
  for (let i = 0; i < n; i++) {
    let a = (i / n) * Math.PI * 2 + rnd(-0.3, 0.3), x = 0, y = 0;
    const pts = [[0, 0]], len = rnd(0.9, 1.8), steps = 6;
    for (let s = 0; s < steps; s++) { a += rnd(-0.5, 0.5); x += Math.cos(a) * len / steps; y += Math.sin(a) * len / steps; pts.push([x, y]);
      if (Math.random() < 0.25) cracks.push({ pts: [[x, y], [x + Math.cos(a + 1) * 0.3, y + Math.sin(a + 1) * 0.3]], at: (s + 1) / steps }); }
    cracks.push({ pts, at: 0 });
  }
  const hole = [];
  for (let i = 0; i < 14; i++) { const a = (i / 14) * Math.PI * 2; hole.push([Math.cos(a) * rnd(0.22, 0.42), Math.sin(a) * rnd(0.35, 0.6)]); }
  return { yaw, h, d: WALL, t: 0, open: 0, hp: 5 + level, maxHp: 5 + level, quota: 2 + level, spawnT: 2.2, cracks, hole, sealed: 0, hitT: 0, color: glow };
}
function newRift() {
  // первая трещина - перед игроком, дальше - где угодно вокруг
  const off = rifts.length === 0 && level === 1 ? rnd(-20, 20) : (Math.random() < 0.5 ? -1 : 1) * rnd(40, 170);
  rifts.push(makeRift(camHeading() + off * D2R, rnd(1.1, 1.9)));
  riftsLeft--;
  sfx.crack(); ARGame.shake = 0.6; buzz([60, 40, 160]);
  showHint(rifts.length > 1 ? 'Новая трещина! Ищи по фиолетовой стрелке' : 'Стена трескается!', 2200);
}
function startLevel(n) {
  level = n; glow = COLORS[(n - 1) % COLORS.length];
  riftsLeft = Math.min(1 + n, 6); nextRiftT = 1.5; levelClearT = 0;
  showBanner('Уровень ' + n, n === 1 ? 'Заделай все трещины' : 'Трещин: ' + riftsLeft);
  updateHud();
}
function updateHud() {
  hud('<span style="font-size:20px">' + '❤'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, MAX_LIVES - lives)) + '</span><br>' + score + ' <small>· уровень ' + level + '</small>');
}
const riftProj = r => project3(worldVec(r.yaw, r.d, r.h), 0.45);
const impProj = m => project3(worldVec(m.yaw, m.d, m.h), m.size * m.grow);

function tap(x, y) {
  // сначала чертята (ближние впереди), потом трещины
  const list = imps.map(m => ({ m, p: impProj(m) })).filter(o => o.p.vis).sort((a, b) => a.m.d - b.m.d);
  for (const { m, p } of list) {
    if (Math.hypot(x - p.sx, y - p.sy) < Math.max(p.r * 1.15, 24)) {
      m.hp--; m.hitT = 0.15;
      if (m.hp <= 0) {
        m.dead = true; const pts = m.inRift ? 30 : 10; score += pts; updateHud();
        burst(p.sx, p.sy, m.glow, 26); floatText(p.sx, p.sy - p.r, '+' + pts + (m.inRift ? ' в зародыше!' : ''));
        sfx.kill(); buzz(30);
      } else { burst(x, y, '#fff', 8); m.d += 0.4; tone(300, 0.08, 'square', 0.06); }
      return;
    }
  }
  for (const r of rifts) {
    if (r.sealed) continue;
    const p = riftProj(r);
    if (!p.vis) continue;
    if (Math.hypot((x - p.sx) / 0.8, y - p.sy) < p.r * 1.1 * Math.max(0.4, r.open)) {
      r.hp--; r.hitT = 0.2;
      burst(x, y, '#ffe9a8', 14, 180); sfx.seal(); buzz(15);
      if (r.hp <= 0) {
        r.sealed = 0.001; score += 50 * level; updateHud();
        floatText(p.sx, p.sy - p.r, 'Заделано! +' + 50 * level, '#ffe066');
        burst(p.sx, p.sy, '#ffd36a', 50, 320); sfx.sealed(); buzz([30, 30, 60]);
        // чертята, что ещё сидят в трещине, проваливаются обратно
        for (const m of imps) if (m.rift === r && m.inRift) { m.dead = true; burst(p.sx, p.sy, m.glow, 10); }
      }
      return;
    }
  }
  sfx.miss(); burst(x, y, '#ffe066', 4);
}

ARGame.setup({
  title: 'Трещина в стене',
  colors: { bg1: '#2a0a3a', glow: '#c35bff', b1: '#a34dff', b2: '#5a1aa0', b3: '#2c0b55' },
  intro: ['Стены твоей комнаты начнут трескаться. Из светящихся разломов полезут чертята.',
    '<b>Тапай по чертятам</b>, а саму трещину <b>заделывай быстрыми тапами</b>, пока она не выпустила всех. Сбил чертёнка, пока он ещё в трещине - тройные очки!',
    '<span class="note">Держи телефон вертикально и крутись по комнате.</span>'],
  startText: 'Начать',
  useGyro: true,
  drawIcon: (c, t) => { c.scale(0.9, 0.9); drawImp(c, { t, hitT: 0, glow: '#c35bff' }); },
  onBegin() { rifts = []; imps = []; score = 0; lives = MAX_LIVES; startLevel(1); },
  onTap: tap,
  update(dt) {
    for (const r of rifts) {
      r.t += dt; r.hitT = Math.max(0, r.hitT - dt);
      if (r.sealed) { r.sealed += dt; continue; }
      r.open = Math.min(1, r.t / 1.6) * (0.55 + 0.45 * r.hp / r.maxHp);
      if (Math.random() < dt * 0.4) sfx.creak();
      r.spawnT -= dt;
      if (r.quota > 0 && r.spawnT <= 0 && r.t > 1.6) {
        r.quota--; r.spawnT = Math.max(1.4, 4.2 - level * 0.35) * rnd(0.7, 1.3);
        const big = level >= 3 && Math.random() < 0.2;
        imps.push({ rift: r, yaw: r.yaw + rnd(-0.03, 0.03), d: r.d + 0.6, h: r.h, h0: r.h, t: 0, grow: 0.05, inRift: true,
          size: big ? 0.36 : 0.24, hp: big ? 3 : 1, speed: (big ? 0.55 : 0.8) * (1 + level * 0.09), hitT: 0, glow: r.color, seed: Math.random() * 9 });
        sfx.emerge();
      }
    }
    rifts = rifts.filter(r => !r.sealed || r.sealed < 2.5);
    for (const m of imps) {
      m.t += dt; m.hitT = Math.max(0, m.hitT - dt);
      if (m.inRift) {
        // выбирается из глубины трещины: растёт и подходит к краю
        m.grow = Math.min(1, 0.05 + m.t / 1.2);
        m.d = m.rift.d + 0.6 * (1 - m.grow);
        if (m.t > 1.3) { m.inRift = false; m.jumpT = 0; }
      } else {
        m.jumpT += dt;
        // прыжок со стены на пол
        const k = Math.min(1, m.jumpT / 0.6);
        m.h = m.h0 * (1 - k) + m.size * k + Math.sin(k * Math.PI) * 0.4 + (k >= 1 ? Math.abs(Math.sin(m.t * 10)) * 0.05 : 0);
        m.d -= m.speed * dt * (k >= 1 ? 1 : 0.5);
        m.yaw += Math.sin(m.t * 2 + m.seed) * 0.15 * dt;
        if (m.d < 0.8) {
          m.dead = true; lives--; updateHud(); sfx.hurt(); ARGame.hurt();
          if (lives <= 0) {
            const b = best.get('treshchina'); let line = 'Рекорд: ' + b;
            if (score > b) { best.set('treshchina', score); line = 'Новый рекорд!'; }
            ARGame.over('Чертята прорвались!', `<p>Очки: <b>${score}</b></p><p>Уровень: <b>${level}</b></p><p>${line}</p>`);
          }
        }
      }
    }
    imps = imps.filter(m => !m.dead);
    if (ARGame.state !== 'play') return;
    if (levelClearT > 0) { levelClearT -= dt; if (levelClearT <= 0) startLevel(level + 1); return; }
    const open = rifts.filter(r => !r.sealed).length;
    if (riftsLeft > 0) {
      nextRiftT -= dt;
      // новая трещина, когда старые заделаны или прошло время
      if (nextRiftT <= 0 && (open === 0 || open < 1 + Math.floor(level / 2))) { newRift(); nextRiftT = Math.max(5, 12 - level); }
    } else if (open === 0 && imps.length === 0) {
      levelClearT = 3; let extra = '';
      if (lives < MAX_LIVES) { lives++; extra = '+1 жизнь'; updateHud(); }
      showBanner('Стены целы!', extra); sfx.sealed();
    }
  },
  render(dt) {
    // лёгкое затемнение краёв
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(10,0,20,0)'); g.addColorStop(1, 'rgba(10,0,20,.6)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const roll = screenRoll();
    for (const r of rifts) drawRift(r, roll);
    // чертята: сначала дальние
    const list = imps.map(m => ({ m, p: impProj(m) }));
    list.filter(o => o.p.vis).sort((a, b) => b.m.d - a.m.d).forEach(({ m, p }) => {
      if (!m.inRift) {
        const sp = project3(worldVec(m.yaw, m.d, 0), m.size);
        if (sp.vis) { ctx.globalAlpha = 0.3; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(sp.sx, sp.sy, sp.r * 0.8, sp.r * 0.22, roll, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
      }
      ctx.save(); ctx.translate(p.sx, p.sy); ctx.rotate(roll);
      const s = p.r / 50; ctx.scale(s, s);
      drawImp(ctx, m);
      ctx.restore();
    });
    list.filter(o => !o.p.vis && !o.m.inRift).forEach(o => drawPointer(o.p.c, o.m.d < 2.5 ? '#ff3b3b' : '#fff', o.m.d < 2.5));
    for (const r of rifts) { if (r.sealed) continue; const p = riftProj(r); if (!p.vis) drawPointer(p.c, r.color, false); }
  },
  renderTop() {
    if (ARGame.state === 'play' || ARGame.state === 'pause')
      drawRadar([...rifts.filter(r => !r.sealed).map(r => ({ yaw: r.yaw, dist: r.d, color: r.color, big: true })),
        ...imps.map(m => ({ yaw: m.yaw, dist: m.d, color: m.d < 2 ? '#ff3b3b' : '#fff' }))], WALL + 0.5);
  }
});

function drawRift(r, roll) {
  const p = riftProj(r);
  if (!p.vis) return;
  const R = p.r * 1.3; // масштаб: 1 единица трещины = R пикселей
  const fade = r.sealed ? Math.max(0, 1 - r.sealed / 2.5) : 1;
  const grow = Math.min(1, r.t / 1.2);
  ctx.save(); ctx.translate(p.sx, p.sy); ctx.rotate(roll);
  if (r.hitT > 0) ctx.translate(rnd(-3, 3), rnd(-3, 3));
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // трещины расходятся по стене
  for (const c of r.cracks) {
    const k = clamp((grow - c.at * 0.6) / 0.6, 0, 1);
    if (k <= 0) continue;
    const n = Math.max(2, Math.ceil(c.pts.length * k));
    ctx.beginPath();
    for (let i = 0; i < n; i++) { const q = c.pts[i]; i ? ctx.lineTo(q[0] * R, q[1] * R) : ctx.moveTo(q[0] * R, q[1] * R); }
    ctx.globalAlpha = fade;
    ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineWidth = Math.max(2, R * 0.05); ctx.stroke();
    ctx.strokeStyle = r.sealed ? '#ffd36a' : r.color; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 14;
    ctx.globalAlpha = fade * (0.6 + Math.sin(time * 6 + c.at * 9) * 0.25); ctx.lineWidth = Math.max(1, R * 0.018); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = fade;
  // дыра
  const o = r.sealed ? r.open * Math.max(0, 1 - r.sealed * 1.5) : r.open;
  if (o > 0.01) {
    ctx.beginPath();
    r.hole.forEach((q, i) => { const x = q[0] * R * o, y = q[1] * R * o; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath();
    ctx.save(); ctx.clip();
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 0.6 * o);
    g.addColorStop(0, '#000'); g.addColorStop(0.5, '#0a0014'); g.addColorStop(1, r.color);
    ctx.fillStyle = g; ctx.fillRect(-R, -R, R * 2, R * 2);
    // вихрь в глубине
    ctx.strokeStyle = r.color; ctx.globalAlpha = 0.5 * fade; ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(0, 0, R * o * (0.1 + i * 0.1), time * 3 + i * 1.7, time * 3 + i * 1.7 + 2.5); ctx.stroke(); }
    // глаза в темноте
    if (!r.sealed && Math.sin(time * 0.7 + r.yaw * 5) > 0.3) {
      ctx.globalAlpha = fade; ctx.fillStyle = r.color; ctx.shadowColor = r.color; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(-R * 0.05 * o, -R * 0.08 * o, R * 0.02, 0, 7); ctx.arc(R * 0.05 * o, -R * 0.08 * o, R * 0.02, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    }
    ctx.restore();
    ctx.globalAlpha = fade;
    ctx.strokeStyle = r.color; ctx.shadowColor = r.color; ctx.shadowBlur = 20; ctx.lineWidth = Math.max(2, R * 0.03);
    ctx.beginPath(); r.hole.forEach((q, i) => { const x = q[0] * R * o, y = q[1] * R * o; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  // золотые "швы" при заделке
  if (!r.sealed && r.hp < r.maxHp) {
    ctx.strokeStyle = '#ffd36a'; ctx.lineWidth = Math.max(2, R * 0.025);
    const sew = r.maxHp - r.hp;
    for (let i = 0; i < sew; i++) { const y = (-0.45 + i * 0.9 / r.maxHp) * R * r.open; ctx.beginPath(); ctx.moveTo(-R * 0.35 * r.open, y); ctx.lineTo(R * 0.35 * r.open, y + R * 0.05); ctx.stroke(); }
    // полоска прочности
    const w = R * 0.9; ctx.fillStyle = '#000a'; ctx.fillRect(-w / 2, -R * 0.85, w, 7);
    ctx.fillStyle = r.color; ctx.fillRect(-w / 2, -R * 0.85, w * r.hp / r.maxHp, 7);
  }
  // осыпается крошка
  if (!r.sealed && Math.random() < 0.3) parts.push({ x: p.sx + rnd(-R, R) * 0.3, y: p.sy + R * 0.3, vx: rnd(-20, 20), vy: 0, g: 400, life: 0.8, color: '#bbb', size: rnd(1, 3) });
  ctx.restore(); ctx.globalAlpha = 1;
}
</script>
</body>
</html>
