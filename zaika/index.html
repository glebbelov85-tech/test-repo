<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7fd0ff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Домик Зайки</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #9bdcff; }
body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.btn { position: absolute; width: 15vmin; height: 15vmin; max-width: 120px; max-height: 120px; border-radius: 50%; background: #fff; box-shadow: 0 .9vmin 0 rgba(0,0,0,.16), 0 1.2vmin 3vmin rgba(0,0,0,.14); box-sizing: border-box; padding: 2.2vmin; cursor: pointer; pointer-events: auto; }
.btn:active { transform: translateY(.6vmin); box-shadow: 0 .3vmin 0 rgba(0,0,0,.16); }
.btn svg { width: 100%; height: 100%; display: block; pointer-events: none; }
.btn.green { background: #4cc257; box-shadow: 0 1.2vmin 0 #2e8b3a, 0 1.6vmin 4vmin rgba(0,0,0,.22); }
#top, #fin, #start { position: fixed; inset: 0; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s; }
#top.on, #fin.on, #start.on { opacity: 1; visibility: visible; }
#lvl { position: fixed; right: calc(2vmin + env(safe-area-inset-right)); top: calc(2vmin + env(safe-area-inset-top)); display: flex; gap: 1.4vmin; opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s; pointer-events: none; }
#lvl.on { opacity: 1; visibility: visible; }
#lvl .btn { position: relative; width: 11.5vmin; height: 11.5vmin; max-width: 92px; max-height: 92px; padding: 1.3vmin; background: rgba(255,255,255,.7); }
#lvl .btn svg { opacity: .45; }
#lvl .btn.sel { background: #fff; outline: .7vmin solid #ffb300; } #lvl .btn.sel svg { opacity: 1; }
#ris { position: fixed; inset: 0; background: #fffdf5; display: none; z-index: 10; }
#ris.on { display: block; }
#ris canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; }
#ro { pointer-events: none; }
#pal { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 1.6vmin; padding: 1.6vmin 1.6vmin calc(2.2vmin + env(safe-area-inset-bottom)); background: rgba(255,236,200,.92); box-shadow: 0 -0.6vmin 2vmin rgba(0,0,0,.12); }
#pal .btn { position: relative; width: 12.5vmin; height: 12.5vmin; max-width: 96px; max-height: 96px; padding: 1.8vmin; }
#pal .btn.ink { border: .9vmin solid #fff; }
#pal .btn.sel { outline: .9vmin solid #5d3a24; transform: translateY(-1vmin); }
#bHome { left: calc(2.5vmin + env(safe-area-inset-left)); top: calc(2.5vmin + env(safe-area-inset-top)); }
#bRep { right: calc(2.5vmin + env(safe-area-inset-right)); top: calc(2.5vmin + env(safe-area-inset-top)); }
#stars { position: absolute; left: 50%; top: calc(3.5vmin + env(safe-area-inset-top)); transform: translateX(-50%); display: flex; gap: 1.2vmin; background: rgba(255,255,255,.35); padding: 1.2vmin 2.4vmin; border-radius: 6vmin; }
#stars i { width: 8.5vmin; height: 8.5vmin; max-width: 64px; max-height: 64px; display: block; transition: transform .4s cubic-bezier(.3,1.8,.5,1); }
#stars i.on { transform: scale(1.12) rotate(-8deg); filter: drop-shadow(0 0 1.2vmin #fff59d); }
#stars svg { width: 100%; height: 100%; display: block; }
#fin .btn { width: 24vmin; height: 24vmin; max-width: 200px; max-height: 200px; bottom: 9vmin; padding: 4vmin; }
#fin.on .btn { animation: popin .5s cubic-bezier(.3,1.6,.5,1) both; }
#bAgain { left: calc(50% - 28vmin); } #bHome2 { left: calc(50% + 4vmin); }
#bPlay { width: 30vmin; height: 30vmin; max-width: 240px; max-height: 240px; left: 50%; bottom: 7vmin; margin-left: calc(min(30vmin, 240px) / -2); padding: 7vmin; animation: pulse 1.3s ease-in-out infinite; }
#ver { position: absolute; right: 2vmin; bottom: 1vmin; font: 2.2vmin sans-serif; color: rgba(0,0,0,.3); }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
@keyframes popin { from { transform: scale(0); } to { transform: scale(1); } }
#wipe { position: fixed; left: 50%; top: 50%; width: 150vmax; height: 150vmax; margin: -75vmax 0 0 -75vmax; border-radius: 50%; background: radial-gradient(#fff6d8, #ffd08a); transform: scale(0); transition: transform .38s cubic-bezier(.5,0,.3,1); pointer-events: none; z-index: 20; }
#wipe.on { transform: scale(1); pointer-events: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div class="btn" id="bHome"><svg viewBox="0 0 100 100"><path d="M14 48 L50 16 L86 48" fill="none" stroke="#5d3a24" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 44 V84 H76 V44" fill="#ffcc80" stroke="#5d3a24" stroke-width="7" stroke-linejoin="round"/><rect x="42" y="58" width="16" height="26" fill="#e57373" stroke="#5d3a24" stroke-width="5"/></svg></div>
  <div id="stars"></div>
  <div class="btn" id="bRep"><svg viewBox="0 0 100 100"><path d="M22 40 h14 l20 -16 v52 l-20 -16 h-14z" fill="#fff" stroke="#5d3a24" stroke-width="6" stroke-linejoin="round"/><path d="M66 36 q10 14 0 28 M76 26 q18 24 0 48" fill="none" stroke="#5d3a24" stroke-width="6" stroke-linecap="round"/></svg></div>
</div>
<div id="fin">
  <div class="btn green" id="bAgain"><svg viewBox="0 0 100 100"><path d="M74 34 A30 30 0 1 0 80 58" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="M62 20 L82 34 L62 46Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg></div>
  <div class="btn" id="bHome2"><svg viewBox="0 0 100 100"><path d="M14 48 L50 16 L86 48" fill="none" stroke="#5d3a24" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 44 V84 H76 V44" fill="#ffcc80" stroke="#5d3a24" stroke-width="7" stroke-linejoin="round"/><rect x="42" y="58" width="16" height="26" fill="#e57373" stroke="#5d3a24" stroke-width="5"/></svg></div>
</div>
<div id="start">
  <div class="btn green" id="bPlay"><svg viewBox="0 0 100 100"><path d="M36 24 L78 50 L36 76Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/></svg></div>
  <div id="ver">v4.1</div>
</div>
<div id="lvl"></div>
<div id="ris"><canvas id="rc"></canvas><canvas id="ro"></canvas><div id="pal"></div></div>
<div id="wipe"></div>
<script src="three.min.js"></script>
<script src="frazy.js?v=4.1"></script>
<script src="voice/zapisi.js?v=4.1"></script>
<script src="modeli.js?v=4.1"></script>
<script src="igra.js?v=4.1"></script>
<script src="komnaty2.js?v=4.1"></script>
<script src="dom.js?v=4.1"></script>
</body>
</html>
