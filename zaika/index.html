<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd7a8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Домик Зайки</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #ffd7a8; }
body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
#app { position: fixed; inset: 0; }
.stage { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; }
.el { position: absolute; transform: translate(-50%, -50%); }
.el > svg { width: 100%; height: 100%; display: block; overflow: visible; pointer-events: none; }
.btn { cursor: pointer; }
.round { border-radius: 50%; background: #fff; box-shadow: 0 8px 0 rgba(0,0,0,.15), 0 10px 24px rgba(0,0,0,.12); box-sizing: border-box; padding: 18px; z-index: 40; }
.round.green { background: #4caf50; box-shadow: 0 10px 0 #2e7d32, 0 14px 30px rgba(0,0,0,.2); }
.round.big { padding: 40px; }
.round:active { transform: translate(-50%, -46%); }
.pstar { z-index: 40; pointer-events: none; }
.ver { font: 22px sans-serif; color: rgba(0,0,0,.3); }
.spark { pointer-events: none; z-index: 60; }
.overlay { left: 0; top: 0; width: 100%; height: 100%; transform: none; background: rgba(255,250,230,.75); z-index: 50; }
.bigstar { z-index: 55; animation: bigstar 1s cubic-bezier(.3,1.6,.5,1) both, wiggle 2s 1s ease-in-out infinite; }
.btn.round.popin { z-index: 56; }
@keyframes bigstar { from { transform: translate(-50%,-50%) scale(0) rotate(-180deg); } to { transform: translate(-50%,-50%) scale(1) rotate(0); } }
@keyframes wiggle { 0%,100% { transform: translate(-50%,-50%) rotate(-6deg); } 50% { transform: translate(-50%,-50%) rotate(6deg) scale(1.05); } }

.bob { animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translate(-50%,-50%); } 50% { transform: translate(-50%, calc(-50% - 14px)); } }
.pulse { animation: pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.1); } }
.spin > svg { animation: spin 30s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.twinkle { animation: twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
.popin { animation: popin .45s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes popin { from { transform: translate(-50%,-50%) scale(0); } to { transform: translate(-50%,-50%) scale(1); } }
.shake { animation: shake .5s ease-in-out; }
@keyframes shake { 0%,100% { transform: translate(-50%,-50%); } 20% { transform: translate(calc(-50% - 18px),-50%) rotate(-4deg); } 40% { transform: translate(calc(-50% + 16px),-50%) rotate(4deg); } 60% { transform: translate(calc(-50% - 10px),-50%); } 80% { transform: translate(calc(-50% + 6px),-50%); } }
.hint { animation: hint 1.2s ease-in-out 2; }
@keyframes hint { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.18); } }
.jump { animation: jump .55s cubic-bezier(.3,1.5,.5,1); }
@keyframes jump { 0%,100% { transform: translate(-50%,-50%); } 40% { transform: translate(-50%, calc(-50% - 50px)) scale(1.06); } }
.glow > svg { filter: drop-shadow(0 0 14px #fff) drop-shadow(0 0 22px #ffeb3b); }
.glow.card, .glow.hole { box-shadow: 0 0 0 10px #fff59d, 0 0 40px 10px #ffeb3b; }

.drag { cursor: grab; z-index: 20; }
.drag.held { z-index: 50; filter: drop-shadow(0 18px 14px rgba(0,0,0,.25)); }
.ball { cursor: pointer; z-index: 10; }
.box { background: linear-gradient(#c98b54, #a86a38); border: 8px solid #7a4a24; border-radius: 40px; box-shadow: inset 0 12px 0 rgba(255,255,255,.18), 0 14px 0 rgba(0,0,0,.15); box-sizing: border-box; }
.hole { border-radius: 30px; z-index: 5; cursor: pointer; }
.shape { z-index: 20; }
.apple { animation: sway 3s ease-in-out infinite; cursor: pointer; z-index: 10; }
@keyframes sway { 0%,100% { transform: translate(-50%,-50%) rotate(-5deg); } 50% { transform: translate(-50%,-50%) rotate(5deg); } }
.plate { background: radial-gradient(#ffffff 55%, #e3e9ef); border: 6px solid #b0bec5; border-radius: 50%; box-shadow: 0 10px 0 rgba(0,0,0,.12); box-sizing: border-box; z-index: 8; }
.slot { border: 6px dashed rgba(229,57,53,.55); border-radius: 50%; box-sizing: border-box; transition: opacity .3s; }
.slot.full { opacity: 0; }
.munch { animation: munch .9s ease-in-out; }
@keyframes munch { 0%,100% { transform: translate(-50%,-50%); } 20%,60% { transform: translate(-50%,-50%) scale(1.08,.92); } 40%,80% { transform: translate(-50%,-50%) scale(.95,1.05); } }
.bed { z-index: 3; cursor: pointer; }
.blanket { z-index: 6; opacity: 0; transition: opacity .4s; pointer-events: none; }
.blanket.on { opacity: 1; }
.bear { z-index: 20; }
.zzz { z-index: 30; pointer-events: none; font: bold 54px sans-serif; color: #fff; }
.zzz b { position: absolute; animation: zz 2.4s ease-out forwards; opacity: 0; }
.zzz b:nth-child(2) { animation-delay: .5s; left: 30px; font-size: 64px; }
.zzz b:nth-child(3) { animation-delay: 1s; left: 60px; font-size: 76px; }
@keyframes zz { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-120px); } }
.card { background: #fff; border-radius: 50%; box-shadow: 0 10px 0 rgba(0,0,0,.12), 0 12px 24px rgba(0,0,0,.1); box-sizing: border-box; padding: 26px; cursor: pointer; z-index: 10; }
.fence { left: 0; width: 100%; top: 45%; height: 120px; transform: translateY(-80%); background:
  repeating-linear-gradient(90deg, transparent 0 30px, #fff 30px 70px, transparent 70px 110px),
  linear-gradient(transparent 30px, #fff 30px 46px, transparent 46px 78px, #fff 78px 94px, transparent 94px); opacity: .85; }
.roof { z-index: 2; }
.front { z-index: 7; }
.wall { background: #fff3d6; border: 8px solid #c9a46a; border-bottom: none; box-sizing: border-box; border-radius: 10px 10px 0 0; z-index: 1; }
.window { z-index: 5; background: #a1704e; border-radius: 34px; padding: 16px; box-sizing: border-box; box-shadow: 0 10px 0 #6d4a30, 0 14px 26px rgba(0,0,0,.18); display: flex; flex-direction: column; }
.window:active { transform: translate(-50%,-48%); box-shadow: 0 4px 0 #6d4a30; }
.pane { flex: 1; border-radius: 22px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 6px solid #fff; }
.pane svg { pointer-events: none; }
.ic3 { display: flex; gap: 4px; align-items: center; height: 80%; }
.ic3 svg { height: 100%; width: 64px; }
.ic3.f svg { height: 70px; width: 70px; }
.ic1 { width: 82%; height: 82%; display: flex; align-items: center; justify-content: center; }
.ic1 svg { width: 100%; height: 100%; }
.ic1.m svg { width: 80%; }
.wstars { display: flex; justify-content: center; gap: 6px; padding-top: 10px; height: 44px; }
.wstars svg { width: 42px; height: 42px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="frazy.js?v=0.1"></script>
<script src="voice/zapisi.js?v=0.1"></script>
<script src="igra.js?v=0.1"></script>
</body>
</html>
